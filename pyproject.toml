[project]
name = "discord-server"
version = "1.4.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "cachetools>=6.2.1",
    "discord-py>=2.7.1",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "kaleido==0.2.1",
    "loguru>=0.7.3",
    "pillow>=12.1.1",
    "plotly<6",
    "pydantic>=2.12.3",
    "pytest>=9.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "upyloadthing>=0.2.1",
    "valkey>=6.1.1",
    "xkcdpass>=1.30.0",
]

[dependency-groups]
dev = [
    "anyio>=4.11.0",
    "pyright>=1.1.411",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "testcontainers>=4.14.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PLE",
    "ASYNC", "DTZ", "LOG", "G", "C4", "RET", "PERF", "PTH", "S",
]
allowed-confusables = ["×", "➕", "➖", "’"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test.
"tests/**" = ["S101"]
# StrEnum of environment variable names, not credential values.
"core/config.py" = ["S105"]
# Raw SQL is built from validated column names and generated bind placeholders;
# every user value goes through a bind parameter.
"features/tickets/handlers/pg_repository.py" = ["S608"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not integration'"
markers = [
    "integration: real-infra tests needing a Postgres container (deselected by default)",
]
